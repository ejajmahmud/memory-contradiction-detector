[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-contradiction-detector"
version = "0.1.0"
description = "Automated proposition contradiction detector that flags conflicting beliefs or obsolete facts in agent long-term memory"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
memory-contradiction-detector = "memory_contradiction_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_contradiction_detector*"]
